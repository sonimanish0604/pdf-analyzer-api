# ------------------------------------------------------
# PURPOSE: Tag → Release → Deploy → Verify (Production)
# TRIGGER: push a tag like v1.4.0
# SECRETS NEEDED (GitHub > Settings > Secrets and variables > Actions):
#   - RENDER_PROD_HOOK   : Render production deploy hook URL
#   - API_HEALTH_KEY     : read-only API key for /health
#   - PROD_API_KEY       : real API key for smoke tests
# OPTIONAL:
#   - (none for registry; Render will build from the repo)
# ------------------------------------------------------

name: Release & Deploy (Prod)

on:
  push:
    tags:
      - "v*"         # any tag starting with v, e.g., v1.4.0 or v1.5.0-rc.1

# Permissions for creating GitHub Releases
permissions:
  contents: write

# Change this to your real prod health URL
env:
  HEALTH_URL: https://pdf-analyzer-api-production.onrender.com/v1/health

jobs:
  build_release_and_deploy:
    name: Build Release, Deploy to Render, Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0         # we need history to parse CHANGELOG

      - name: Validate SemVer tag
        # Ensures tags look like v1.2.3 or v1.2.3-rc.1
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$'; then
            echo "Tag $TAG is not SemVer (vX.Y.Z or vX.Y.Z-rc.N)"; exit 1; fi
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        # If CHANGELOG has headings like "## [1.4.0] - 2025-09-18"
        # we extract that section; else we fall back to entire file.
        run: |
          VER="${TAG#v}"
          if grep -q "## \\[${VER}\\]" CHANGELOG.md; then
            awk "/^## \\[${VER}\\]/,/^## \\[/" CHANGELOG.md | sed '$d' > RELEASE_NOTES.md || true
          fi
          # If nothing extracted (e.g., rc tags or different format), use whole file
          if [ ! -s RELEASE_NOTES.md ]; then cp CHANGELOG.md RELEASE_NOTES.md; fi
          echo "Using release notes:"
          head -n 40 RELEASE_NOTES.md || true

      # --- OPTIONAL: SBOM generation for the repository’s Docker image ---
      # If Render builds from git, you won’t have a local image here.
      # You can leave SBOM out, or generate an SBOM for the source tree instead.
      # Example source SBOM (kept optional but recommended long-term):
      - name: Generate source SBOM (Syft)  # optional
        uses: anchore/sbom-action@v0.17.6
        with:
          path: .
          format: spdx-json
          output-file: sbom-${{ env.TAG }}-source.spdx.json
        continue-on-error: true

      - name: Create GitHub Release
        # Publishes the release. Attaches SBOM if it exists.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          files: |
            sbom-${{ env.TAG }}-source.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Render (prod)
        # Triggers your Render PROD deploy (Render pulls repo and builds)
        env:
          RENDER_PROD_HOOK: ${{ secrets.RENDER_PROD_HOOK }}
        run: |
          if [ -z "$RENDER_PROD_HOOK" ]; then
            echo "RENDER_PROD_HOOK not set"; exit 1; fi
          curl -sSf -X POST "$RENDER_PROD_HOOK"
          echo "Deploy hook called."

      - name: Health check (with retries)
        # Waits for Render to finish and app to be healthy
        env:
          API_HEALTH_KEY: ${{ secrets.API_HEALTH_KEY }}
          HEALTH_URL: ${{ env.HEALTH_URL }}
        run: |
          if [ -z "$API_HEALTH_KEY" ]; then
            echo "API_HEALTH_KEY not set"; exit 1; fi
          if [ -z "$HEALTH_URL" ]; then
            echo "HEALTH_URL env not set"; exit 1; fi

          # 15 tries x 10s = ~2.5 minutes
          for i in {1..15}; do
            echo "Health attempt $i..."
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "x-api-key: ${API_HEALTH_KEY}" "$HEALTH_URL")
            if [ "$CODE" = "200" ]; then
              echo "Healthy ✅"; exit 0; fi
              echo "Not healthy yet ($CODE), retry $i"
            sleep 10
          done
          echo "Service unhealthy after retries"; exit 1

  post_deploy_smoke:
    # Only run if deploy/health succeeded
    needs: build_release_and_deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Reuse your known-good samples & assertions
        cases:
          - name: clean
            file: samples/pdfanalyzer-testdoc.pdf
            assert: '.summary.encrypted==false and .summary.embedded_javascript==false and .summary.embedded_files==false and .summary.embeddedurl==false and .summary.fakepdf==false'
          - name: encrypted
            file: samples/pdfanalyzer-passwordprotect.pdf
            assert: '.summary.encrypted==true'
          - name: has_js
            file: samples/pdf_with_js_alert.pdf
            assert: '.summary.embedded_javascript==true'
          - name: embedded
            file: samples/pdfanalyzer-embedword.pdf
            assert: '.summary.embedded_files==true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure sample exists — ${{ matrix.cases.name }}
        # Fails early if a sample path is wrong/missing
        run: |
          test -f "${{ matrix.cases.file }}" || (echo "Missing ${{ matrix.cases.file }}"; exit 1)

      - name: Analyze ${{ matrix.cases.name }} (prod)
        # Posts the sample PDF to your prod API and asserts the JSON
        env:
          API_KEY: ${{ secrets.PROD_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "PROD_API_KEY not set"; exit 1; fi

          # Update the endpoint path if different in your app
          OUT=$(curl -fsS -X POST https://YOUR-PROD-HOST.onrender.com/v1/analyze \
            -H "x-api-key: $API_KEY" \
            -F "file=@${{ matrix.cases.file }};type=application/pdf")

          # Show the output for easy debugging in logs
          echo "$OUT" | jq .

          # Evaluate the assertion expression using jq
          echo "$OUT" | jq -e '${{ matrix.cases.assert }}' >/dev/null